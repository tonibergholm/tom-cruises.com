name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: bergholm.net
          port: 2222
          username: toni
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            set -e
            cd /home/toni/apps/tom-cruises
            git pull https://github.com/tonibergholm/tom-cruises.com.git main
            npm ci
            NEXT_PUBLIC_BUILD_SHA=$(git rev-parse --short HEAD) npm run build
            pm2 reload tom-cruises --update-env
