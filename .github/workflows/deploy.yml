name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: bergholm.net
          port: 2222
          username: toni
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            set -e
            cd /var/www/tom-cruises.com
            git pull origin main
            npm ci --omit=dev
            npm run build
            pm2 reload tom-cruises --update-env
